# Shared by every proxied location. Included rather than repeated so the
# prod and staging vhosts can't drift apart.

proxy_http_version 1.1;
proxy_set_header Connection "";

# Host must be preserved so Laravel generates URLs for the real domain, and
# X-Forwarded-Proto is what tells it the request was HTTPS — TLS terminates
# here, so without these the app emits http:// links. Requires
# `$middleware->trustProxies(at: '*')` in bootstrap/app.php to be honoured.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Same trap as fastcgi_buffer_size in the app vhost: nginx buffers the
# upstream's response headers into a single buffer (4k by default) and
# returns 502 "upstream sent too big header" if they overflow. Laravel's
# stacked Set-Cookie headers exceed 4k on admin pages, so the proxy needs
# the same headroom the app container already has.
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;

proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
