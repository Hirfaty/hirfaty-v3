# Placeholder used for hirfaty.com before real launch — serves the static
# "coming soon" page over TLS, straight from the proxy. Selected by
# entrypoint.sh once a certificate exists for the domain.
#
# Selected when PROD_MODE=coming-soon (the default) — switch to
# PROD_MODE=app once the real app should go live on this domain, no file
# changes needed.

server {
    listen 80;
    server_name hirfaty.com www.hirfaty.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hirfaty.com www.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # This vhost is what actually answers on hirfaty.com today (PROD_MODE
    # defaults to coming-soon), so it is where HSTS first reaches real
    # visitors — it must not be left to the -app variant alone.
    include /etc/nginx/security-headers.conf;

    root /var/www/coming-soon;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
