# Bootstrap config for init.hirfaty.com (staging), used before a TLS
# certificate exists. entrypoint.sh swaps this for staging-ssl.conf once the
# cert appears.

server {
    listen 80;
    server_name init.hirfaty.com;

    # Must stay >= PHP's post_max_size (64M, docker/app/uploads.ini) — nginx
    # rejects oversized bodies before PHP is ever reached, so if this is the
    # smaller number it silently caps uploads below what the app allows.
    client_max_body_size 64m;

    # Must stay unauthenticated: certbot's HTTP-01 challenge is fetched by
    # Let's Encrypt, which cannot supply basic-auth credentials. Guarding
    # this location would break both issuance and renewal.
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    # No dedicated /media/ block — see the matching comment in
    # staging-ssl.conf for why one here breaks images with AccessDenied.
    # This bootstrap file only serves before a cert exists anyway.
    location / {
        auth_basic "Hirfaty staging";
        auth_basic_user_file /etc/nginx/htpasswd;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $staging_upstream app-staging;
        proxy_pass http://$staging_upstream:80;
        include /etc/nginx/proxy-headers.conf;
    }
}
