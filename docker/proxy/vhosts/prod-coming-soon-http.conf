# Placeholder used for hirfaty.com before real launch — serves the static
# "coming soon" page straight from the proxy, no app stack needed at all.
# Bootstrap (pre-cert) variant. entrypoint.sh swaps this for
# prod-coming-soon-ssl.conf once a certificate exists.
#
# Selected when PROD_MODE=coming-soon (the default) — switch to
# PROD_MODE=app once the real app should go live on this domain, no file
# changes needed.

server {
    listen 80;
    server_name hirfaty.com www.hirfaty.com;

    root /var/www/coming-soon;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
