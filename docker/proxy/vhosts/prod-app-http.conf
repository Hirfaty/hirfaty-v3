# Bootstrap config for hirfaty.com, used before a TLS certificate exists.
# Serves the production app over plain HTTP and exposes the ACME HTTP-01
# challenge path so certbot can issue the cert. entrypoint.sh swaps this for
# prod-app-ssl.conf once /etc/letsencrypt/live/<domain>/fullchain.pem appears.
#
# Only used when PROD_MODE=app — see prod-coming-soon-http.conf for the
# placeholder site served while the real launch is on hold.

server {
    listen 80;
    server_name hirfaty.com www.hirfaty.com;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Resolving through docker's embedded DNS at request time (rather than
        # letting nginx resolve the name once at startup) means the proxy still
        # boots when the prod stack is down — that domain just returns 502
        # instead of nginx refusing to start and taking staging down with it.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $prod_upstream app-prod;
        proxy_pass http://$prod_upstream:80;
        include /etc/nginx/proxy-headers.conf;
    }
}
