# Production: hirfaty.com (+ www) over TLS, proxied to the prod app stack.
# Selected by entrypoint.sh once a certificate exists on disk.

server {
    listen 80;
    server_name hirfaty.com www.hirfaty.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hirfaty.com www.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Must stay >= PHP's post_max_size (64M, docker/app/uploads.ini) — nginx
    # rejects oversized bodies before PHP is ever reached, so if this is the
    # smaller number it silently caps uploads below what the app allows.
    client_max_body_size 64m;

    location / {
        # See prod-app-http.conf for why the upstream is resolved via a variable.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $prod_upstream app-prod;
        proxy_pass http://$prod_upstream:80;
        include /etc/nginx/proxy-headers.conf;
    }
}
