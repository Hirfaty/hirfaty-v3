# Staging: init.hirfaty.com over TLS, proxied to the staging app stack and
# gated behind HTTP basic auth so the pre-launch site isn't publicly
# browsable or indexable.

server {
    listen 80;
    server_name init.hirfaty.com;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name init.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/init.hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/init.hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Must stay >= PHP's post_max_size (64M, docker/app/uploads.ini) — nginx
    # rejects oversized bodies before PHP is ever reached, so if this is the
    # smaller number it silently caps uploads below what the app allows.
    client_max_body_size 64m;

    # Belt and braces alongside the password prompt — keeps staging out of
    # search results even if someone shares the credentials.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # No dedicated /media/ block here on purpose — it existed briefly and
    # broke images with AccessDenied. `proxy_pass http://seaweedfs:8333;`
    # has no path after the host, so nginx forwards the request URI
    # unchanged: `/media/products/5/x.png` reached SeaweedFS's S3 gateway
    # asking for bucket "media" instead of bucket "hirfaty". `location /`
    # below already sends everything — /media/ included — to app-staging,
    # whose own nginx (docker/app/vhosts/app.conf) does this correctly: it
    # rewrites the path to the /hirfaty/ bucket prefix AND strips the
    # Authorization header this proxy's auth_basic leaves on the request
    # (SeaweedFS reads a Basic-auth header as a malformed AWS signature and
    # also returns AccessDenied). Fix it there, not here — a second copy of
    # this logic is exactly how it drifted out of sync and broke.
    location / {
        auth_basic "Hirfaty staging";
        auth_basic_user_file /etc/nginx/htpasswd;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $staging_upstream app-staging;
        proxy_pass http://$staging_upstream:80;
        include /etc/nginx/proxy-headers.conf;
    }
}

# ── SeaweedFS admin, staging only ───────────────────────────────────────
# Two separate ports rather than paths under / — SeaweedFS's own UIs emit
# root-relative links (/ui/..., asset paths, file browsing), so proxying them
# under a path prefix would need rewriting every link. A dedicated port with
# nginx terminating TLS at the domain root sidesteps that entirely: same cert
# (TLS doesn't care about port), same htpasswd as the app itself, just a
# different listen port. Debug/ops tooling, not on the app's own request path
# — reuse of proxy-headers.conf here is a convenience, not a requirement.
#
# Reachable at https://init.hirfaty.com:8888/ (filer) and :9333/ (master).
# Nothing analogous exists for prod: `seaweedfs` stays off the `edge` network
# there until someone actually asks for this on production too.

server {
    listen 8888 ssl;
    http2 on;
    server_name init.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/init.hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/init.hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Filer: browse every uploaded file (product photos, store logos/banners)
    # as a tree, the closest thing SeaweedFS has to a file-manager dashboard.
    location / {
        auth_basic "Hirfaty staging — SeaweedFS filer";
        auth_basic_user_file /etc/nginx/htpasswd;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $seaweedfs_filer seaweedfs-staging;
        proxy_pass http://$seaweedfs_filer:8888;
        include /etc/nginx/proxy-headers.conf;
    }
}

server {
    listen 9333 ssl;
    http2 on;
    server_name init.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/init.hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/init.hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Master: cluster status, volumes, disk usage.
    location / {
        auth_basic "Hirfaty staging — SeaweedFS master";
        auth_basic_user_file /etc/nginx/htpasswd;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $seaweedfs_master seaweedfs-staging;
        proxy_pass http://$seaweedfs_master:9333;
        include /etc/nginx/proxy-headers.conf;
    }
}
