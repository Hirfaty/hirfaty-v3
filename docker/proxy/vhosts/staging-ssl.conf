# Staging: init.hirfaty.com over TLS, proxied to the staging app stack and
# gated behind HTTP basic auth so the pre-launch site isn't publicly
# browsable or indexable.

server {
    listen 80;
    server_name init.hirfaty.com;

    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name init.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/init.hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/init.hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    # Belt and braces alongside the password prompt — keeps staging out of
    # search results even if someone shares the credentials.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        auth_basic "Hirfaty staging";
        auth_basic_user_file /etc/nginx/htpasswd;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $staging_upstream app-staging;
        proxy_pass http://$staging_upstream:80;
        include /etc/nginx/proxy-headers.conf;
    }
}
