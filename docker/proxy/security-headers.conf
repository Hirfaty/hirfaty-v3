# Response headers applied to every TLS vhost this proxy serves.
#
# `include`d at *server* level (not inside a location) in the -ssl vhosts. The
# -http variants deliberately don't get it: they only exist before a
# certificate is issued, and HSTS over plain HTTP is ignored by browsers
# anyway.
#
# Every directive carries `always` so the header is still sent on error
# responses (403/404/500) — without it nginx only adds headers to 2xx/3xx, and
# an error page is exactly where clickjacking or MIME-sniffing protection
# matters just as much.
#
# CAUTION: nginx's `add_header` does not merge across levels. If a `location`
# block in a vhost ever adds a header of its own, it stops inheriting *all* of
# these and must include this file again itself.

# Hide the nginx version from the Server header and error pages.
server_tokens off;

# Pin the browser to HTTPS for a year, subdomains included (init.hirfaty.com
# and the SeaweedFS admin ports are all TLS already).
#
# Deliberately NOT `preload`: submission to the browser preload list is
# effectively irreversible, while this header alone can be wound back by
# lowering max-age and waiting it out. Don't add `preload` without deciding
# that separately.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Never let a browser second-guess a declared Content-Type. Stops an uploaded
# file served as image/* being re-interpreted as HTML or JavaScript.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking. `frame-ancestors` is the modern, CSP-based control and is what
# current browsers honour; X-Frame-Options is kept alongside it for older ones.
# Both say the same thing, so they cannot disagree.
#
# This is the ONLY CSP directive set here on purpose. A `script-src` policy is
# the valuable half of CSP, but this app serves Inertia + Vite, whose bundles
# and HMR client need either a nonce threaded through the Blade template or a
# hash allowlist regenerated on every build. Shipping a guessed `script-src`
# would either break the storefront outright or be so permissive
# ('unsafe-inline') that it protects nothing. Doing it properly is an app-side
# change, not a proxy one.
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Send the full URL only to ourselves; cross-origin requests (and anything
# downgraded to HTTP) get the origin or nothing. Keeps order references and
# account paths out of third-party referer logs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here needs these, and denying them means an injected script can't
# quietly ask for them either. `payment` is left unset rather than denied so a
# future card processor isn't blocked by a header nobody remembers setting.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
