; Upload limits for the app container.
;
; PHP's defaults (upload_max_filesize=2M, post_max_size=8M) are far below what
; config/media.php — the app's own source of truth — actually permits: 5 MB per
; image and 50 MB per video. Anything over 2 MB was rejected by PHP itself
; before validation ran, surfacing as Laravel's unhelpful "The media.0 failed
; to upload." rather than a size error, since the `uploaded` rule fires on
; PHP-level upload failures.
;
; These must stay coherent across three layers, largest last:
;   config/media.php  50 MB   largest single file (video)
;   upload_max_filesize 50M   must be >= that
;   post_max_size       64M   must be >= upload_max_filesize, plus room for
;                             several images and the form fields in one request
;   client_max_body_size 64m  in BOTH docker/app/vhosts/app.conf and the
;                             proxy vhosts — nginx rejects before PHP is
;                             reached, so it can't be the smallest value
;
; Raising config/media.php later means revisiting all of the above.

upload_max_filesize = 50M
post_max_size = 64M

; A product gallery can carry several photos plus a video in one submit;
; PHP's default of 20 is close enough to be worth some headroom.
max_file_uploads = 30

; GD decompresses images to raw bitmaps, so a 4096x4096 photo (the ceiling in
; config/media.php) needs well over PHP's 128M default while being processed.
memory_limit = 256M
