# Bootstrap config used before a TLS certificate exists. Serves the app over
# plain HTTP and exposes the ACME HTTP-01 challenge path for certbot.
# entrypoint.sh swaps this out for nginx-ssl.conf once a cert is issued.

server {
    listen 80;
    listen [::]:80;
    server_name init.hirfaty.com;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /media/ {
        proxy_pass http://seaweedfs:8333/hirfaty/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
