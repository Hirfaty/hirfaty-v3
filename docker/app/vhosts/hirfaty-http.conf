# Bootstrap config used before hirfaty.com has a TLS certificate. Serves the
# static "coming soon" page over plain HTTP and exposes the ACME HTTP-01
# challenge path for certbot. entrypoint.sh swaps this out for
# hirfaty-ssl.conf once a cert exists. Independent from init.hirfaty.com/
# init-*.conf — this is a separate, unrelated static site.

server {
    listen 80;
    listen [::]:80;
    server_name hirfaty.com www.hirfaty.com;

    root /var/www/coming-soon;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
