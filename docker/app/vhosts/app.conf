# The app container's only vhost. It is never exposed to the internet — the
# shared proxy (docker/proxy/) owns 80/443 and handles TLS, the HTTP→HTTPS
# redirect, ACME challenges, per-domain routing and staging's basic auth.
# All this has to do is serve the app over plain HTTP on the private network,
# so it answers on any Host (`server_name _`) and both stacks reuse it
# unchanged.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Must stay >= PHP's post_max_size (64M, docker/app/uploads.ini) — nginx
    # rejects oversized bodies before PHP is ever reached, so if this is the
    # smaller number it silently caps uploads below what the app allows.
    client_max_body_size 64m;

    # Debian's stock nginx.conf turns gzip on but leaves gzip_types commented
    # out, so only text/html was ever compressed — the JS and CSS bundles (the
    # bulk of every first visit) went out raw. Compressing here rather than at
    # the edge proxy keeps it in the one vhost both stacks share. The edge
    # proxies with HTTP/1.1 (proxy-headers.conf), which gzip_http_version
    # requires, and passes Content-Encoding/Vary through untouched. text/html
    # is implied by `gzip on` and must not be listed again. woff2 and images
    # are already compressed, so they are left out on purpose.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        text/xml
        image/svg+xml
        image/x-icon;

    # Vite's build output. Every file under /build/assets/ carries a content
    # hash in its name, so a URL never changes meaning: a new build emits new
    # names. Browsers can therefore keep these for a year without asking
    # again. manifest.json lives one level up in /build/ and is deliberately
    # not covered. A missing asset 404s here instead of booting Laravel.
    location ^~ /build/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        # Resolved through a variable, not a bare hostname in proxy_pass — the
        # same pattern every proxy vhost in this repo uses. nginx resolves a
        # *static* proxy_pass hostname exactly once, when the worker starts,
        # and holds that IP for the worker's whole life; it never re-resolves
        # on its own. `seaweedfs` getting recreated for any reason (network
        # change, image update, restart) hands it a new container IP, and a
        # static proxy_pass here would keep dialing the old one — every
        # request 502ing — until this container's nginx also happened to
        # restart. This is exactly what broke staging's /media/ URLs after
        # `seaweedfs` was recreated onto the edge network for its admin UI.
        # `resolver` + `set` forces a fresh DNS lookup per request instead.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $seaweedfs_upstream seaweedfs;

        # The bucket prefix MUST come from this rewrite, not from a URI on
        # proxy_pass. nginx only performs the usual "replace the matched
        # location prefix with the proxy_pass URI" substitution when the
        # directive contains no variables; once it does, the documented
        # behaviour is that the URI "is passed to the server as is, replacing
        # the original request URI". So `proxy_pass http://$upstream:8333/hirfaty/`
        # asked SeaweedFS for exactly `/hirfaty/` — a bucket *listing* — on
        # every request, dropping the object path entirely. Anonymous holds
        # Read but not List in s3-config.json, so that came back as
        # AccessDenied with `<Resource>/hirfaty/</Resource>`, which reads like
        # a permissions problem but is really a lost path. `rewrite ... break`
        # plus a proxy_pass with no URI keeps the dynamic resolution above and
        # the correct object path.
        rewrite ^/media/(.*)$ /hirfaty/$1 break;
        proxy_pass http://$seaweedfs_upstream:8333;
        proxy_set_header Host $host;

        # On staging, the edge proxy's basic-auth Authorization header rides
        # along on every request the browser makes to this origin — including
        # this one — and nginx's auth_basic doesn't strip it after validating.
        # SeaweedFS's S3 gateway then sees a non-empty but unparseable
        # (HTTP Basic, not AWS SigV4) Authorization header, treats it as a
        # failed signature rather than "no auth, use the anonymous identity",
        # and returns AccessDenied even though the anonymous/Read grant in
        # s3-config.json is completely correct. Clear it — SeaweedFS's own
        # access control (identities in s3-config.json) is what should decide
        # this, not whatever unrelated auth happened one hop upstream.
        proxy_set_header Authorization "";

        # Uploads are only ever written with `$file->store()`, which names the
        # object with a random hashName(); replacing a photo stores a new key
        # and deletes the old one rather than overwriting it. So a /media/ URL
        # is as immutable as a Vite asset. SeaweedFS sends no caching headers,
        # which had browsers re-downloading every product photo on every
        # visit. Without `always`, a 403/404 from SeaweedFS is not cached.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # nginx buffers the upstream's *response headers* into a single buffer
        # of fastcgi_buffer_size (4k by default) and 502s outright if they
        # don't fit — "upstream sent too big header". Laravel's stacked
        # Set-Cookie headers (laravel_session, XSRF-TOKEN, appearance,
        # sidebar_state) overflow 4k on admin pages, turning a healthy PHP 200
        # into a 502. 32k leaves ample headroom.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
