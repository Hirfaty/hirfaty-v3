# Full config used once a TLS certificate exists at
# /etc/letsencrypt/live/init.hirfaty.com/. entrypoint.sh selects this over
# init-http.conf when it detects the cert on disk.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name init.hirfaty.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Debian bookworm ships nginx 1.22, which predates the standalone
    # "http2 on;" directive (needs nginx >= 1.25.1) — use the older
    # "listen ... http2;" form instead, or nginx fails to parse this file.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name init.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/init.hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/init.hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;

    location /media/ {
        proxy_pass http://seaweedfs:8333/hirfaty/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # nginx buffers the upstream's *response headers* into a single buffer
        # of fastcgi_buffer_size (4k by default) and 502s outright if they
        # don't fit — "upstream sent too big header". Laravel's stacked
        # Set-Cookie headers (laravel_session, XSRF-TOKEN, appearance,
        # sidebar_state) overflow 4k on admin pages, turning a healthy PHP 200
        # into a 502. 32k leaves ample headroom.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
