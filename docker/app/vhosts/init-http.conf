# Bootstrap config used before init.hirfaty.com has a TLS certificate. Serves
# the app over plain HTTP and exposes the ACME HTTP-01 challenge path for
# certbot. entrypoint.sh swaps this out for init-ssl.conf once a cert exists.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name init.hirfaty.com;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /media/ {
        proxy_pass http://seaweedfs:8333/hirfaty/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Keep in sync with init-ssl.conf — see the explanation there. Without
        # this, large response headers make nginx 502 a perfectly good 200.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
