# Full config used once a TLS certificate exists at
# /etc/letsencrypt/live/hirfaty.com/ (covers both hirfaty.com and
# www.hirfaty.com as SANs on one cert — see `make prod-cert-init-hirfaty`).
# entrypoint.sh selects this over hirfaty-http.conf when it detects the cert
# on disk.

server {
    listen 80;
    listen [::]:80;
    server_name hirfaty.com www.hirfaty.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hirfaty.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://hirfaty.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/coming-soon;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
