# Full config used once a TLS certificate exists at
# /etc/letsencrypt/live/hirfaty.com/. entrypoint.sh selects this over
# nginx-http.conf when it detects the cert on disk.

server {
    listen 80;
    listen [::]:80;
    server_name hirfaty.com www.hirfaty.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hirfaty.com www.hirfaty.com;

    ssl_certificate /etc/letsencrypt/live/hirfaty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hirfaty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;

    location /media/ {
        proxy_pass http://seaweedfs:8333/hirfaty/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
