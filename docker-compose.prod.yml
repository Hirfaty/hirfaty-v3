# Production stack for the Debian VPS: app (nginx + php-fpm), a queue worker,
# the Laravel scheduler, Postgres and SeaweedFS. Serves hirfaty.com.
# Run via the `prod-*` Makefile targets, e.g. `make prod-up`.
#
# This stack binds no host ports. TLS, certbot and Host-header routing live in
# docker-compose.proxy.yml, which reaches `app` over the shared `hirfaty-edge`
# network under the alias `app-prod`. Everything else stays on the private
# `internal` network, isolated from the staging stack.

name: hirfaty

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: hirfaty-app:latest
    container_name: hirfaty-app
    env_file: .env
    environment:
      # Pinned here, over whatever .env says. This container is also on the
      # shared `edge` network, where staging's SeaweedFS answers to the bare
      # service name `seaweedfs` — with `http://seaweedfs:8333`, Docker's DNS
      # answered prod's uploads and /media/ reads with staging's storage
      # (seen in October 2026, when product photos broke). The container
      # name exists only on prod's `internal` network.
      # entrypoint.sh points nginx's /media/ upstream at this same host.
      SEAWEEDFS_ENDPOINT: http://hirfaty-seaweedfs:8333
    depends_on:
      db:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    volumes:
      # The brochure PDF. Not in the image: it is ~35 MB, gitignored, and
      # changes on its own schedule rather than with a release — see
      # BrochureLeadService::PATH. Bind-mounted rather than `docker cp`d in
      # because `make prod-release` rebuilds and recreates this container on
      # every deploy, which would throw a copied-in file away each time.
      #
      # Read-only: the app only ever reads this file (exists/download), so
      # there is no reason for the container to be able to change it.
      - ./storage-data/brochure:/var/www/html/storage/app/private/brochure:ro
    networks:
      internal:
      edge:
        aliases:
          - app-prod
    restart: unless-stopped

  queue:
    image: hirfaty-app:latest
    container_name: hirfaty-queue
    env_file: .env
    entrypoint: /usr/local/bin/entrypoint.sh
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600', '--sleep=3']
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  scheduler:
    image: hirfaty-app:latest
    container_name: hirfaty-scheduler
    env_file: .env
    entrypoint: /usr/local/bin/entrypoint.sh
    command: ['sh', '-c', 'while true; do php artisan schedule:run --no-interaction; sleep 60; done']
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: hirfaty-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hirfaty}
      POSTGRES_USER: ${DB_USERNAME:-hirfaty}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hirfaty}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-hirfaty} -d ${DB_DATABASE:-hirfaty}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs
    container_name: hirfaty-seaweedfs
    command: >
      server -s3 -s3.config=/etc/seaweedfs/s3-config.json -dir=/data
      -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs_data:/data
      - ./docker/seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    networks:
      - internal
    restart: unless-stopped

  # Read-only browser for the live photos and the photo archives in the
  # nightly backups (docker/media-browser/server.py). Kept out of the website
  # and off by default: the `tools` profile means `make prod-up` and deploys
  # never start it — `make media-browser` does, `make media-browser-stop`
  # removes it. Published on the server's loopback only; reach it through
  # `ssh -L 8090:127.0.0.1:8090 <server>`, then http://localhost:8090.
  media-browser:
    build:
      context: .
      dockerfile: docker/media-browser/Dockerfile
    image: hirfaty-media-browser:latest
    container_name: hirfaty-media-browser
    profiles: ['tools']
    # /var/backups/hirfaty is root-only (0700, see backup.sh); pinned so an
    # unprivileged default user in the seaweedfs base image can't lock it out.
    user: root
    environment:
      FILER_URL: http://hirfaty-seaweedfs:8888
      BUCKET: ${SEAWEEDFS_BUCKET:-hirfaty}
    volumes:
      - /var/backups/hirfaty:/backups:ro
      # Archives sent through its page; kept until deleted there.
      - media_browser_uploads:/uploads
    ports:
      - '127.0.0.1:8090:8090'
    networks:
      - internal

volumes:
  # Left unnamed so they keep the names compose already gave them
  # (hirfaty_db_data / hirfaty_seaweedfs_data) — renaming would orphan the
  # existing production data.
  db_data:
  seaweedfs_data:
  media_browser_uploads:

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: hirfaty-edge
