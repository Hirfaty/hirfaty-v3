# Push to `main` (i.e. merging staging → main) → the VPS pulls, rebuilds and
# migrates hirfaty.com. Same shape as deploy-staging.yml, pointed at the
# production checkout and `make prod-release`.
#
# Secrets, under Settings → Secrets and variables → Actions. Prod and staging
# share one VPS and one deploy user, so every PROD_* secret is optional and
# falls back to its STAGING_* twin — the existing staging secrets are enough
# to get going. Set the PROD_* ones only if production moves to its own box
# or gets its own deploy key:
#   PROD_SSH_HOST  (falls back to STAGING_SSH_HOST)
#   PROD_SSH_USER  (falls back to STAGING_SSH_USER)
#   PROD_SSH_KEY   (falls back to STAGING_SSH_KEY)
#   PROD_SSH_PORT  (falls back to STAGING_SSH_PORT, then 22)
#
# The VPS checkout needs its own read access to this repo (it runs
# `git fetch`), which it already has from the original `git clone`.

name: deploy production

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without an empty commit.
  workflow_dispatch:

concurrency:
  # Serialise deploys and never cancel one in flight — see deploy-staging.yml.
  group: deploy-production
  cancel-in-progress: false

# No test gate, for the same reason deploy-staging.yml has none: the suite
# still carries pre-existing failures on untouched code. The tests workflow
# still runs on every push to main, so a red run is visible — it just does
# not block the deploy.

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY || secrets.STAGING_SSH_KEY }}

      - name: Deploy to VPS over SSH
        # Retries only guard the flaky SSH handshake; prod-release is
        # idempotent (up -d, migrate --force), so re-running it is safe.
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST || secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER || secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT || secrets.STAGING_SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          remote_script='
            set -euo pipefail
            cd ~/prod-hirfaty

            # Hard reset rather than `git pull`, as on staging: the box must
            # match main exactly. .env, docker/proxy/htpasswd,
            # docker/seaweedfs/s3-config.json and storage-data/ are all
            # gitignored and survive untouched.
            git fetch --prune origin
            git reset --hard origin/main

            make prod-release

            docker compose -f docker-compose.prod.yml --env-file .env ps
          '

          attempt=1
          max_attempts=3
          until ssh -p "$SSH_PORT" -o ConnectTimeout=15 -o ServerAliveInterval=15 \
              "$SSH_USER@$SSH_HOST" "$remote_script"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Deploy failed after $max_attempts attempts" >&2
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            attempt=$((attempt + 1))
            sleep 15
          done
