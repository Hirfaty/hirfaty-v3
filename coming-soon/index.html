<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hirfaty — Bientôt en ligne</title>
<meta name="description" content="Hirfaty, le marché de l'artisanat marocain, arrive bientôt." />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="pattern" aria-hidden="true"></div>

<main class="card">
  <img class="logo" src="assets/logo.png" alt="Hirfaty" width="72" height="72" />

  <p class="eyebrow" data-i18n="eyebrow">Souk marocain</p>
  <h1 data-i18n="heading">L'artisanat marocain arrive bientôt.</h1>
  <p class="subtitle" data-i18n="subtitle">
    Nous préparons un marché où chaque pièce raconte l'histoire de la main qui l'a façonnée.
  </p>

  <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="contact">
    <span data-i18n="contact_label">Une question ? Écrivez-nous</span>
    <a href="mailto:contact@hirfaty.com">contact@hirfaty.com</a>
  </div>

  <div class="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="fr" class="active">FR</button>
    <button type="button" data-lang="ar">عربية</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
